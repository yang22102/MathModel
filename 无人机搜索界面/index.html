<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无人机区域划分与搜索系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    header {
      background: linear-gradient(90deg, #16213e, #0f3460);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.3rem;
      color: #e94560;
      letter-spacing: 1px;
    }
    header .subtitle { font-size: 0.82rem; color: #a0aec0; }

    /* ── main layout ── */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── left sidebar ── */
    .sidebar {
      width: 260px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid #0f3460;
    }
    .sidebar-section h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      color: #e94560;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 6px;
    }
    .form-row label {
      font-size: 0.82rem;
      color: #a0aec0;
      white-space: nowrap;
    }
    .form-row input[type=range] {
      flex: 1;
      accent-color: #e94560;
    }
    .form-row .val-badge {
      background: #0f3460;
      color: #63b3ed;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.78rem;
      min-width: 28px;
      text-align: center;
    }
    select, button {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 0.84rem;
      margin-bottom: 6px;

    }
    select:focus { outline: none; border-color: #e94560; }
    button { border-color: #e94560; background: #e94560; font-weight: 600; letter-spacing: 0.5px; transition: background 0.2s; }
    button:hover { background: #c73652; }
    button.btn-secondary { background: #0f3460; border-color: #63b3ed; color: #63b3ed; }
    button.btn-secondary:hover { background: #1a4a8a; }
    button.btn-danger { background: #2d3748; border-color: #fc8181; color: #fc8181; }
    button.btn-danger:hover { background: #4a2020; }

    /* color swatches for drones */
    .drone-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .drone-legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.78rem; color: #a0aec0; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; }

    /* ── center canvas area ── */
    .canvas-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    }
    #mainCanvas {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 4px;
      cursor: crosshair;
      max-width: 100%;
      max-height: 100%;
    }
    .canvas-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .canvas-toolbar button {
      width: auto;
      padding: 5px 14px;
      font-size: 0.8rem;
      margin: 0;
    }

    /* ── right stats panel ── */
    .stats-panel {
      width: 220px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .stats-section {
      padding: 14px 16px;
      border-bottom: 1px solid #0f3460;
    }
    .stats-section h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      color: #e94560;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-size: 0.82rem;
    }
    .stat-item .label { color: #a0aec0; }
    .stat-item .value { color: #63b3ed; font-weight: 600; }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #0f3460;
      border-radius: 3px;
      margin: 3px 0 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .drone-stat-row {
      margin-bottom: 8px;
      padding: 6px 8px;
      background: #0f1e36;
      border-radius: 6px;
      border-left: 3px solid #e94560;
    }
    .drone-stat-row .drone-name { font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; }
    .drone-stat-row .drone-detail { font-size: 0.75rem; color: #718096; }

    /* ── status bar ── */
    .status-bar {
      background: #0f3460;
      padding: 4px 16px;
      font-size: 0.78rem;
      color: #63b3ed;
      flex-shrink: 0;
      display: flex;
      gap: 20px;
    }
    .status-bar span { color: #e94560; font-weight: 600; }
  </style>

<body>

<header>
  <div>
    <h1>🚁 无人机区域划分与搜索系统</h1>
    <div class="subtitle">Drone Area Division &amp; Search Simulation</div>
  </div>
</header>

<div class="main-layout">

  <!-- ══ LEFT SIDEBAR ══ -->
  <div class="sidebar">

    <div class="sidebar-section">
      <h3>区域设置</h3>
      <div class="form-row">
        <label>宽度(格)</label>
        <input type="range" id="areaW" min="10" max="60" value="30" oninput="updateBadge('areaW','areaWVal')">
        <span class="val-badge" id="areaWVal">30</span>
      </div>
      <div class="form-row">
        <label>高度(格)</label>
        <input type="range" id="areaH" min="10" max="60" value="30" oninput="updateBadge('areaH','areaHVal')">
        <span class="val-badge" id="areaHVal">30</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>无人机设置</h3>
      <div class="form-row">
        <label>无人机数量</label>
        <input type="range" id="droneCount" min="1" max="8" value="3" oninput="onDroneCountChange()">
        <span class="val-badge" id="droneCountVal">3</span>
      </div>
      <div class="form-row">
        <label>速度</label>
        <input type="range" id="droneSpeed" min="1" max="10" value="4" oninput="updateBadge('droneSpeed','droneSpeedVal')">
        <span class="val-badge" id="droneSpeedVal">4</span>
      </div>
      <div class="drone-legend" id="droneLegend"></div>
    </div>

    <div class="sidebar-section">
      <h3>区域划分算法</h3>
      <select id="partitionAlgo">
        <option value="grid">均匀网格划分</option>
        <option value="voronoi">Voronoi 划分</option>
        <option value="strip">条带划分</option>
        <option value="quadrant">象限划分</option>
      </select>
      <button onclick="applyPartition()">▦ 应用区域划分</button>
    </div>

    <div class="sidebar-section">
      <h3>搜索算法</h3>
      <select id="searchAlgo">
        <option value="zigzag">S 形覆盖搜索</option>
        <option value="spiral">螺旋式搜索</option>
        <option value="random">随机游走搜索</option>
        <option value="boustrophedon">往复扫描搜索</option>
      </select>
      <button onclick="startSearch()">▶ 开始搜索</button>
      <button class="btn-secondary" onclick="pauseSearch()">⏸ 暂停 / 继续</button>
      <button class="btn-danger" onclick="resetAll()">↺ 重置</button>
    </div>

    <div class="sidebar-section">
      <h3>障碍物</h3>
      <select id="obstacleMode">
        <option value="none">无操作</option>
        <option value="add">点击添加障碍</option>
        <option value="remove">点击清除障碍</option>
      </select>
      <button class="btn-secondary" onclick="clearObstacles()">清除所有障碍</button>
      <button class="btn-secondary" onclick="generateRandomObstacles()">随机生成障碍</button>
    </div>

  </div>

  <!-- ══ CENTER CANVAS ══ -->
  <div class="canvas-wrapper">
    <div class="canvas-toolbar">
      <button onclick="applyPartition(); startSearch()">⚡ 一键运行</button>
      <button class="btn-secondary" onclick="exportCanvas()">💾 保存图像</button>
    </div>
    <canvas id="mainCanvas" width="600" height="600"></canvas>
  </div>

  <!-- ══ RIGHT STATS ══ -->
  <div class="stats-panel">

    <div class="stats-section">
      <h3>总体统计</h3>
      <div class="stat-item">
        <span class="label">总覆盖率</span>
        <span class="value" id="totalCoverage">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="totalCoverageBar" style="width:0%;background:#e94560"></div>
      </div>
      <div class="stat-item">
        <span class="label">已搜索格数</span>
        <span class="value" id="searchedCells">0</span>
      </div>
      <div class="stat-item">
        <span class="label">总格数</span>
        <span class="value" id="totalCells">900</span>
      </div>
      <div class="stat-item">
        <span class="label">仿真步数</span>
        <span class="value" id="simSteps">0</span>
      </div>
      <div class="stat-item">
        <span class="label">状态</span>
        <span class="value" id="simStatus">待机</span>
      </div>
    </div>

    <div class="stats-section">
      <h3>无人机详情</h3>
      <div id="droneStats"></div>
    </div>

    <div class="stats-section">
      <h3>说明</h3>
      <div style="font-size:0.76rem;color:#718096;line-height:1.6">
        1. 调整区域大小和无人机数量<br>
        2. 选择划分算法，点击「应用区域划分」<br>
        3. 选择搜索算法，点击「开始搜索」<br>
        4. 可在地图上点击添加/清除障碍物<br>
        5. 颜色区域 = 各无人机负责范围
      </div>
    </div>

  </div>
</div>

<div class="status-bar">
  <div>坐标: <span id="mousePos">-</span></div>
  <div>格子大小: <span id="cellSizeInfo">20px</span></div>
  <div>划分算法: <span id="currentPartition">-</span></div>
  <div>搜索算法: <span id="currentSearch">-</span></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  Configuration & State
// ═══════════════════════════════════════════════════════════
const DRONE_COLORS = [
  '#e94560','#63b3ed','#68d391','#f6ad55',
  '#b794f4','#f687b3','#4fd1c5','#fbd38d'
];
const DRONE_DARK = [
  '#7a1a2a','#2b5282','#276749','#7b4f10',
  '#553c9a','#97266d','#285e61','#975a16'
];

// Animation timing constants
const ANIM_MIN_INTERVAL_MS = 20;   // fastest update interval (ms)
const ANIM_MAX_INTERVAL_MS = 200;  // slowest update interval (ms)
const ANIM_SPEED_MULTIPLIER = 18;  // ms reduction per speed unit

// Obstacle generation
const OBSTACLE_DENSITY = 0.08;     // fraction of cells to use as random obstacles

let areaW = 30, areaH = 30;
let cellSize = 20;
let droneCount = 3;
let obstacles = new Set(); // "x,y"
let zoneMap = [];   // [y][x] = droneIndex (-1 = no zone)
let visitedMap = []; // [y][x] = droneIndex (-1 = unvisited)
let drones = [];    // { x, y, zone, path, color, visited, steps }
let animHandle = null;
let simPaused = false;
let simStepCount = 0;
let partitionApplied = false;

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════
function updateBadge(id, badgeId) {
  document.getElementById(badgeId).textContent = document.getElementById(id).value;
}
function onDroneCountChange() {
  droneCount = +document.getElementById('droneCount').value;
  document.getElementById('droneCountVal').textContent = droneCount;
  buildDroneLegend();
}
function buildDroneLegend() {
  const el = document.getElementById('droneLegend');
  el.innerHTML = '';
  for (let i = 0; i < droneCount; i++) {
    el.innerHTML += `<div class="drone-legend-item">
      <div class="swatch" style="background:${DRONE_COLORS[i]}"></div>无人机${i+1}
    </div>`;
  }
}
function cellKey(x, y) { return x + ',' + y; }

function readParams() {
  areaW = +document.getElementById('areaW').value;
  areaH = +document.getElementById('areaH').value;
  droneCount = +document.getElementById('droneCount').value;
}

function resizeCanvas() {
  const wrapper = canvas.parentElement;
  const maxW = wrapper.clientWidth  - 40;
  const maxH = wrapper.clientHeight - 60;
  cellSize = Math.max(6, Math.floor(Math.min(maxW / areaW, maxH / areaH)));
  canvas.width  = cellSize * areaW;
  canvas.height = cellSize * areaH;
  document.getElementById('cellSizeInfo').textContent = cellSize + 'px';
}

// ═══════════════════════════════════════════════════════════
//  Init maps
// ═══════════════════════════════════════════════════════════
function initMaps() {
  readParams();
  resizeCanvas();
  zoneMap    = Array.from({length: areaH}, () => new Array(areaW).fill(-1));
  visitedMap = Array.from({length: areaH}, () => new Array(areaW).fill(-1));
  // Remove obstacles outside new bounds
  for (const k of obstacles) {
    const [ox, oy] = k.split(',').map(Number);
    if (ox >= areaW || oy >= areaH) obstacles.delete(k);
  }
  document.getElementById('totalCells').textContent = areaW * areaH;
  updateStats();
}

// ═══════════════════════════════════════════════════════════
//  Partition Algorithms
// ═══════════════════════════════════════════════════════════
function applyPartition() {
  stopSearch();
  readParams();
  resizeCanvas();
  initMaps();
  const algo = document.getElementById('partitionAlgo').value;
  document.getElementById('currentPartition').textContent = {
    grid: '均匀网格', voronoi: 'Voronoi', strip: '条带', quadrant: '象限'
  }[algo];

  switch (algo) {
    case 'grid':    partitionGrid();    break;
    case 'voronoi': partitionVoronoi(); break;
    case 'strip':   partitionStrip();   break;
    case 'quadrant':partitionQuadrant();break;
  }
  initDrones();
  drawAll();
  partitionApplied = true;
}

/** 均匀网格划分: cut the grid into roughly equal rectangular blocks */
function partitionGrid() {
  const cols = Math.ceil(Math.sqrt(droneCount));
  const rows = Math.ceil(droneCount / cols);
  const bw = Math.ceil(areaW / cols);
  const bh = Math.ceil(areaH / rows);
  for (let y = 0; y < areaH; y++) {
    for (let x = 0; x < areaW; x++) {
      const col = Math.floor(x / bw);
      const row = Math.floor(y / bh);
      const idx = row * cols + col;
      zoneMap[y][x] = Math.min(idx, droneCount - 1);
    }
  }
}

/** 条带划分: vertical strips */
function partitionStrip() {
  const bw = Math.ceil(areaW / droneCount);
  for (let y = 0; y < areaH; y++) {
    for (let x = 0; x < areaW; x++) {
      zoneMap[y][x] = Math.min(Math.floor(x / bw), droneCount - 1);
    }
  }
}

/** 象限划分: tries to divide into quadrant-like sectors */
function partitionQuadrant() {
  const cx = areaW / 2, cy = areaH / 2;
  for (let y = 0; y < areaH; y++) {
    for (let x = 0; x < areaW; x++) {
      const dx = x - cx, dy = y - cy;
      let angle = Math.atan2(dy, dx); // -π .. π
      if (angle < 0) angle += 2 * Math.PI; // 0 .. 2π
      const idx = Math.floor(angle / (2 * Math.PI / droneCount));
      zoneMap[y][x] = Math.min(idx, droneCount - 1);
    }
  }
}

/** Voronoi: 随机放置种子点，每格属于最近种子 */
function partitionVoronoi() {
  // Generate well-spaced seed positions using stratified sampling
  const seeds = [];
  const cols = Math.ceil(Math.sqrt(droneCount));
  const rows = Math.ceil(droneCount / cols);
  for (let i = 0; i < droneCount; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    const sx = Math.round((c + 0.5) * areaW / cols + (Math.random() - 0.5) * areaW / cols * 0.6);
    const sy = Math.round((r + 0.5) * areaH / rows + (Math.random() - 0.5) * areaH / rows * 0.6);
    seeds.push([Math.max(0, Math.min(areaW-1, sx)), Math.max(0, Math.min(areaH-1, sy))]);
  }
  for (let y = 0; y < areaH; y++) {
    for (let x = 0; x < areaW; x++) {
      let best = Infinity, bestIdx = 0;
      for (let i = 0; i < seeds.length; i++) {
        const d = (x - seeds[i][0])**2 + (y - seeds[i][1])**2;
        if (d < best) { best = d; bestIdx = i; }
      }
      zoneMap[y][x] = bestIdx;
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  Drone Initialization
// ═══════════════════════════════════════════════════════════
function initDrones() {
  drones = [];
  for (let i = 0; i < droneCount; i++) {
    // Find a starting cell that belongs to this drone's zone and is not an obstacle
    let startX = 0, startY = 0, found = false;
    outer:
    for (let y = 0; y < areaH; y++) {
      for (let x = 0; x < areaW; x++) {
        if (zoneMap[y][x] === i && !obstacles.has(cellKey(x, y))) {
          startX = x; startY = y; found = true; break outer;
        }
      }
    }
    // Build the list of cells in this drone's zone (excluding obstacles)
    const zone = [];
    for (let y = 0; y < areaH; y++) {
      for (let x = 0; x < areaW; x++) {
        if (zoneMap[y][x] === i && !obstacles.has(cellKey(x, y))) {
          zone.push([x, y]);
        }
      }
    }
    drones.push({
      idx: i,
      x: startX,
      y: startY,
      color: DRONE_COLORS[i],
      dark: DRONE_DARK[i],
      zone,
      zoneCells: zone.length,
      path: [],
      steps: 0,
      done: false,
    });
  }
  updateDroneStats();
}

// ═══════════════════════════════════════════════════════════
//  Search Path Planning
// ═══════════════════════════════════════════════════════════
function buildSearchPaths() {
  const algo = document.getElementById('searchAlgo').value;
  document.getElementById('currentSearch').textContent = {
    zigzag: 'S形覆盖', spiral: '螺旋', random: '随机游走', boustrophedon: '往复扫描'
  }[algo];

  for (const drone of drones) {
    switch (algo) {
      case 'zigzag':        drone.path = pathZigzag(drone);         break;
      case 'spiral':        drone.path = pathSpiral(drone);         break;
      case 'random':        drone.path = pathRandom(drone);         break;
      case 'boustrophedon': drone.path = pathBoustrophedon(drone);  break;
    }
    drone.pathIdx = 0;
    drone.done = false;
    drone.steps = 0;
    if (drone.path.length > 0) {
      drone.x = drone.path[0][0];
      drone.y = drone.path[0][1];
    }
  }
}

/** Get bounding box of a drone's zone */
function zoneBBox(drone) {
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const [x,y] of drone.zone) {
    if(x<minX)minX=x; if(x>maxX)maxX=x;
    if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  return {minX,maxX,minY,maxY};
}

/** S形覆盖 (zigzag row by row) */
function pathZigzag(drone) {
  const {minX,maxX,minY,maxY} = zoneBBox(drone);
  const zoneSet = new Set(drone.zone.map(([x,y])=>cellKey(x,y)));
  const path = [];
  for (let y = minY; y <= maxY; y++) {
    const row = [];
    for (let x = minX; x <= maxX; x++) {
      if (zoneSet.has(cellKey(x,y))) row.push([x,y]);
    }
    if (y % 2 === 1) row.reverse();
    path.push(...row);
  }
  return path;
}

/** 往复扫描 (boustrophedon, column by column) */
function pathBoustrophedon(drone) {
  const {minX,maxX,minY,maxY} = zoneBBox(drone);
  const zoneSet = new Set(drone.zone.map(([x,y])=>cellKey(x,y)));
  const path = [];
  for (let x = minX; x <= maxX; x++) {
    const col = [];
    for (let y = minY; y <= maxY; y++) {
      if (zoneSet.has(cellKey(x,y))) col.push([x,y]);
    }
    if (x % 2 === 1) col.reverse();
    path.push(...col);
  }
  return path;
}

/** 螺旋式搜索 (outward spiral from zone centroid) */
function pathSpiral(drone) {
  // BFS-based spiral: sort zone cells by increasing distance from center
  if (drone.zone.length === 0) return [];
  let cx = 0, cy = 0;
  for (const [x,y] of drone.zone) { cx+=x; cy+=y; }
  cx /= drone.zone.length; cy /= drone.zone.length;
  const sorted = [...drone.zone].sort((a,b) => {
    return ((a[0]-cx)**2+(a[1]-cy)**2) - ((b[0]-cx)**2+(b[1]-cy)**2);
  });
  return sorted;
}

/** 随机游走搜索 */
function pathRandom(drone) {
  if (drone.zone.length === 0) return [];
  // Shuffle zone cells
  const arr = [...drone.zone];
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ═══════════════════════════════════════════════════════════
//  Search simulation loop
// ═══════════════════════════════════════════════════════════
function startSearch() {
  if (!partitionApplied) { applyPartition(); }
  stopSearch();
  // Reset visit map
  visitedMap = Array.from({length: areaH}, () => new Array(areaW).fill(-1));
  buildSearchPaths();
  simStepCount = 0;
  simPaused = false;
  document.getElementById('simStatus').textContent = '搜索中';
  const speed = +document.getElementById('droneSpeed').value;
  const interval = Math.max(ANIM_MIN_INTERVAL_MS, ANIM_MAX_INTERVAL_MS - speed * ANIM_SPEED_MULTIPLIER);
  animHandle = setInterval(simulationStep, interval);
}

function pauseSearch() {
  if (!animHandle) return;
  simPaused = !simPaused;
  document.getElementById('simStatus').textContent = simPaused ? '已暂停' : '搜索中';
}

function stopSearch() {
  if (animHandle) { clearInterval(animHandle); animHandle = null; }
  document.getElementById('simStatus').textContent = partitionApplied ? '已停止' : '待机';
}

function simulationStep() {
  if (simPaused) return;
  let allDone = true;
  for (const drone of drones) {
    if (drone.done) continue;
    allDone = false;
    // Advance path index
    if (drone.pathIdx < drone.path.length) {
      const [nx, ny] = drone.path[drone.pathIdx];
      drone.x = nx; drone.y = ny;
      visitedMap[ny][nx] = drone.idx;
      drone.pathIdx++;
      drone.steps++;
    } else {
      drone.done = true;
    }
  }
  simStepCount++;
  drawAll();
  updateStats();
  if (allDone) {
    stopSearch();
    document.getElementById('simStatus').textContent = '✅ 搜索完成';
  }
}

// ═══════════════════════════════════════════════════════════
//  Rendering
// ═══════════════════════════════════════════════════════════
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Zone backgrounds
  if (partitionApplied) {
    for (let y = 0; y < areaH; y++) {
      for (let x = 0; x < areaW; x++) {
        const z = zoneMap[y][x];
        if (z >= 0) {
          ctx.fillStyle = hexToRgba(DRONE_COLORS[z], 0.18);
          ctx.fillRect(x*cellSize, y*cellSize, cellSize, cellSize);
        }
      }
    }
  }

  // 2. Visited cells
  for (let y = 0; y < areaH; y++) {
    for (let x = 0; x < areaW; x++) {
      const v = visitedMap[y][x];
      if (v >= 0) {
        ctx.fillStyle = hexToRgba(DRONE_COLORS[v], 0.55);
        ctx.fillRect(x*cellSize, y*cellSize, cellSize, cellSize);
      }
    }
  }

  // 3. Grid lines
  ctx.strokeStyle = 'rgba(55,65,81,0.6)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= areaW; x++) {
    ctx.beginPath(); ctx.moveTo(x*cellSize, 0); ctx.lineTo(x*cellSize, areaH*cellSize); ctx.stroke();
  }
  for (let y = 0; y <= areaH; y++) {
    ctx.beginPath(); ctx.moveTo(0, y*cellSize); ctx.lineTo(areaW*cellSize, y*cellSize); ctx.stroke();
  }

  // 4. Zone borders (draw heavier lines at zone boundaries)
  if (partitionApplied) {
    ctx.lineWidth = 1.5;
    for (let y = 0; y < areaH; y++) {
      for (let x = 0; x < areaW; x++) {
        const z = zoneMap[y][x];
        // right border
        if (x+1 < areaW && zoneMap[y][x+1] !== z) {
          ctx.strokeStyle = hexToRgba(DRONE_COLORS[z], 0.7);
          ctx.beginPath(); ctx.moveTo((x+1)*cellSize, y*cellSize); ctx.lineTo((x+1)*cellSize, (y+1)*cellSize); ctx.stroke();
        }
        // bottom border
        if (y+1 < areaH && zoneMap[y+1][x] !== z) {
          ctx.strokeStyle = hexToRgba(DRONE_COLORS[z], 0.7);
          ctx.beginPath(); ctx.moveTo(x*cellSize, (y+1)*cellSize); ctx.lineTo((x+1)*cellSize, (y+1)*cellSize); ctx.stroke();
        }
      }
    }
  }

  // 5. Obstacles
  ctx.fillStyle = '#374151';
  for (const k of obstacles) {
    const [ox, oy] = k.split(',').map(Number);
    ctx.fillRect(ox*cellSize+1, oy*cellSize+1, cellSize-2, cellSize-2);
    // X mark
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ox*cellSize+3, oy*cellSize+3);
    ctx.lineTo((ox+1)*cellSize-3, (oy+1)*cellSize-3);
    ctx.moveTo((ox+1)*cellSize-3, oy*cellSize+3);
    ctx.lineTo(ox*cellSize+3, (oy+1)*cellSize-3);
    ctx.stroke();
  }

  // 6. Drone search trails (current path)
  if (animHandle || simStepCount > 0) {
    for (const drone of drones) {
      if (drone.pathIdx > 1) {
        ctx.strokeStyle = hexToRgba(drone.color, 0.4);
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < drone.pathIdx; i++) {
          const [px, py] = drone.path[i];
          const cx2 = px*cellSize + cellSize/2, cy2 = py*cellSize + cellSize/2;
          if (i === 0) ctx.moveTo(cx2, cy2);
          else ctx.lineTo(cx2, cy2);
        }
        ctx.stroke();
      }
    }
  }

  // 7. Drones (icons)
  for (const drone of drones) {
    if (!partitionApplied) continue;
    const px = drone.x * cellSize + cellSize/2;
    const py = drone.y * cellSize + cellSize/2;
    const r = Math.max(5, cellSize * 0.4);

    // shadow
    ctx.shadowColor = drone.color;
    ctx.shadowBlur = 8;

    // body circle
    ctx.fillStyle = drone.color;
    ctx.beginPath(); ctx.arc(px, py, r, 0, 2*Math.PI); ctx.fill();

    // number
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(8, r*1.1)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(drone.idx+1, px, py);
  }
  ctx.shadowBlur = 0;
}

// ═══════════════════════════════════════════════════════════
//  Stats
// ═══════════════════════════════════════════════════════════
function updateStats() {
  let visited = 0;
  const perDrone = new Array(droneCount).fill(0);
  for (let y = 0; y < areaH; y++) {
    for (let x = 0; x < areaW; x++) {
      const v = visitedMap[y][x];
      if (v >= 0) { visited++; perDrone[v]++; }
    }
  }
  const total = areaW * areaH;
  const pct = total === 0 ? 0 : Math.round(visited / total * 100);
  document.getElementById('totalCoverage').textContent = pct + '%';
  document.getElementById('totalCoverageBar').style.width = pct + '%';
  document.getElementById('searchedCells').textContent = visited;
  document.getElementById('simSteps').textContent = simStepCount;
  updateDroneStats(perDrone);
}

function updateDroneStats(perDrone) {
  const el = document.getElementById('droneStats');
  el.innerHTML = '';
  for (let i = 0; i < droneCount; i++) {
    const drone = drones[i];
    const vc = (perDrone && perDrone[i]) || 0;
    const zc = drone ? drone.zoneCells : '?';
    const zonePct = zc > 0 ? Math.round(vc / zc * 100) : 0;
    el.innerHTML += `
      <div class="drone-stat-row" style="border-left-color:${DRONE_COLORS[i]}">
        <div class="drone-name" style="color:${DRONE_COLORS[i]}">无人机 ${i+1}</div>
        <div class="progress-bar-bg" style="margin:3px 0;">
          <div class="progress-bar-fill" style="width:${zonePct}%;background:${DRONE_COLORS[i]}"></div>
        </div>
        <div class="drone-detail">区域覆盖: ${zonePct}% (${vc}/${zc}格)</div>
        <div class="drone-detail">步数: ${drone ? drone.steps : 0}</div>
        ${drone ? `<div class="drone-detail">位置: (${drone.x}, ${drone.y})</div>` : ''}
      </div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  Obstacles
// ═══════════════════════════════════════════════════════════
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = Math.floor((e.clientX - rect.left) / (rect.width  / areaW));
  const cy = Math.floor((e.clientY - rect.top)  / (rect.height / areaH));
  document.getElementById('mousePos').textContent = `(${cx}, ${cy})`;
});

canvas.addEventListener('click', e => {
  const mode = document.getElementById('obstacleMode').value;
  if (mode === 'none') return;
  const rect = canvas.getBoundingClientRect();
  const cx = Math.floor((e.clientX - rect.left) / (rect.width  / areaW));
  const cy = Math.floor((e.clientY - rect.top)  / (rect.height / areaH));
  if (cx < 0 || cx >= areaW || cy < 0 || cy >= areaH) return;
  const k = cellKey(cx, cy);
  if (mode === 'add')    obstacles.add(k);
  if (mode === 'remove') obstacles.delete(k);
  drawAll();
});

function clearObstacles() { obstacles.clear(); drawAll(); }

function generateRandomObstacles() {
  obstacles.clear();
  const count = Math.floor(areaW * areaH * OBSTACLE_DENSITY);
  for (let i = 0; i < count; i++) {
    const x = Math.floor(Math.random() * areaW);
    const y = Math.floor(Math.random() * areaH);
    obstacles.add(cellKey(x, y));
  }
  drawAll();
}

// ═══════════════════════════════════════════════════════════
//  Reset
// ═══════════════════════════════════════════════════════════
function resetAll() {
  stopSearch();
  obstacles.clear();
  partitionApplied = false;
  simStepCount = 0;
  initMaps();
  drones = [];
  buildDroneLegend();
  updateStats();
  drawAll();
  document.getElementById('currentPartition').textContent = '-';
  document.getElementById('currentSearch').textContent = '-';
  document.getElementById('simStatus').textContent = '待机';
}

// ═══════════════════════════════════════════════════════════
//  Export
// ═══════════════════════════════════════════════════════════
function exportCanvas() {
  const link = document.createElement('a');
  link.download = 'drone_search_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════════════════
//  Responsive resize
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  if (partitionApplied) { resizeCanvas(); drawAll(); }
  else { resizeCanvas(); }
});

// ═══════════════════════════════════════════════════════════
//  Slider live-update badges
// ═══════════════════════════════════════════════════════════
['areaW','areaH'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    updateBadge(id, id+'Val');
  });
});

// ═══════════════════════════════════════════════════════════
//  Bootstrap
// ═══════════════════════════════════════════════════════════
buildDroneLegend();
initMaps();
drawAll();
</script>
